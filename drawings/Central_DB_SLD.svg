  <text x="50" y="84" fill="#cfe0f5" font-size="14">Telangana, India  -  3Ph 415V 50Hz  -  100% Aluminium cables (IS 7098 / IS 694)  -  bimetallic/pin lugs  -  10kA C-curve MCBs (no MCCBs)</text>

  <!-- ================= INCOMING ================= -->
