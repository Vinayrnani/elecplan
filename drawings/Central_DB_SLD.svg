  <text x="80" y="326" class="tb">OV / UV PROTECTOR</text>
  <text x="80" y="344" class="ts">270V high cutoff, auto-reclose</text>
  <text x="80" y="360" class="ts">Type-2 SPD 40kA 4-Pole</text>

  <line x1="70" y1="334" x2="40" y2="334" class="wire"/>
  <line x1="40" y1="334" x2="40" y2="372" class="wire"/>
  <line x1="20" y1="372" x2="60" y2="372" class="wire"/>
  <line x1="28" y1="381" x2="52" y2="381" class="wire"/>
  <line x1="35" y1="390" x2="45" y2="390" class="wire"/>
