  <text x="80" y="246" class="tb">63A 4P MANUAL</text>
  <text x="80" y="264" class="tb">CHANGEOVER</text>
  <text x="80" y="280" class="ts">Mains / Generator</text>

  <line x1="280" y1="254" x2="305" y2="254" class="wire"/>
