<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1300" viewBox="0 0 1700 1300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#222"/>
    </marker>
    <style>
      .wire { stroke:#222; stroke-width:2; fill:none; }
      .bus  { stroke:#111; stroke-width:4; fill:none; }
      .box  { fill:#f7f9fc; stroke:#1f3a5f; stroke-width:2; }
      .dev  { fill:#fff8e1; stroke:#8a6d00; stroke-width:2; }
      .t    { fill:#111; font-size:15px; }
      .ts   { fill:#333; font-size:13px; }
      .tb   { fill:#111; font-size:16px; font-weight:bold; }
      .th   { fill:#fff; font-size:17px; font-weight:bold; }
      .tt   { fill:#0b2e59; font-size:22px; font-weight:bold; }
      .tt2  { fill:#333; font-size:14px; }
      .grid { stroke:#dfe6ef; stroke-width:1; }
      .mono { font-family:"Courier New", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="1300" fill="#ffffff"/>

  <!-- Title block -->
  <rect x="20" y="20" width="1660" height="80" style="fill:#0b2e59; stroke:#0b2e59; stroke-width:2"/>
