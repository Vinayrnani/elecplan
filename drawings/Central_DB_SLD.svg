  <text x="930" y="775" class="tb">Device</text>
  <text x="1080" y="775" class="tb">Rating</text>
  <text x="1230" y="775" class="tb">Type</text>
  <text x="1400" y="775" class="tb">Load / Remarks</text>
  <line x1="870" y1="785" x2="1650" y2="785" class="grid" stroke="#0b2e59" stroke-width="1.5"/>

  <g class="t">
    <text x="880" y="812">1</text><text x="930" y="812">MCB</text><text x="1080" y="812">40A 4P</text><text x="1230" y="812">C-curve 10kA</text><text x="1400" y="812">Container Sub-DB feeder</text>
    <text x="880" y="840">2</text><text x="930" y="840">MCB</text><text x="1080" y="840">32A 2P</text><text x="1230" y="840">C-curve 10kA</text><text x="1400" y="840">North Shed</text>
    <text x="880" y="868">3</text><text x="930" y="868">RCBO</text><text x="1080" y="868">16A 2P</text><text x="1230" y="868">30 mA, C-curve</text><text x="1400" y="868">Swimming Pool Pump</text>
    <text x="880" y="896">4</text><text x="930" y="896">MCB</text><text x="1080" y="896">16A 2P</text><text x="1230" y="896">C-curve 10kA</text><text x="1400" y="896">Projector &amp; Sound System</text>
    <text x="880" y="924">5-7</text><text x="930" y="924">MCB</text><text x="1080" y="924">6A / 10A SP</text><text x="1230" y="924">C-curve 10kA</text><text x="1400" y="924">3 x Street Light circuits</text>
    <text x="880" y="952">8</text><text x="930" y="952">MCB</text><text x="1080" y="952">6A / 10A SP</text><text x="1230" y="952">C-curve 10kA</text><text x="1400" y="952">Pathway Lights</text>
    <text x="880" y="980">9</text><text x="930" y="980">MCB</text><text x="1080" y="980">6A SP</text><text x="1230" y="980">C-curve 10kA</text><text x="1400" y="980">ESP32 5V SMPS &amp; sensors</text>
    <text x="880" y="1008">-</text><text x="930" y="1008">CO</text><text x="1080" y="1008">63A 4P</text><text x="1230" y="1008">Manual</text><text x="1400" y="1008">Mains / Generator changeover</text>
    <text x="880" y="1036">-</text><text x="930" y="1036">SPD</text><text x="1080" y="1036">40kA 4P</text><text x="1230" y="1036">Type-2</text><text x="1400" y="1036">Surge protection</text>
    <text x="880" y="1064">-</text><text x="930" y="1064">RCCB</text><text x="1080" y="1064">40A 4P</text><text x="1230" y="1064">30 mA</text><text x="1400" y="1064">Container Sub-DB</text>
    <text x="880" y="1092">-</text><text x="930" y="1092">BUSBAR</text><text x="1080" y="1092">100A</text><text x="1230" y="1092">-</text><text x="1400" y="1092">Main DB distribution</text>
  </g>

  <line x1="870" y1="1110" x2="1650" y2="1110" class="grid" stroke="#0b2e59" stroke-width="1"/>
  <text x="880" y="1138" class="tb">NOTES</text>
  <text x="880" y="1162" class="ts">1. All MCBs: 10kA breaking capacity, C-curve. No MCCBs used.</text>
  <text x="880" y="1184" class="ts">2. All cables 100% aluminium (IS 7098 / IS 694) with bimetallic / pin lugs at every termination.</text>
  <text x="880" y="1206" class="ts">3. Internal DB jumpers: 10 sqmm / 6 sqmm flexible copper with bootlace ferrules.</text>
  <text x="880" y="1228" class="ts">4. Trench lengths: South 40 m, Container 45 m, North 48 m, East 47 m (per site layout).</text>

</svg>
