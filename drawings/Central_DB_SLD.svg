  <text x="80" y="182" class="ts">415V 3Ph 50Hz</text>
  <text x="80" y="198" class="ts">16 sqmm 4C Al Armoured, 40 m</text>

  <line x1="175" y1="204" x2="175" y2="224" class="wire"/>

